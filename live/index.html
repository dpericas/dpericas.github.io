<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vòlei Santpedor · En directe</title>
<meta name="description" content="Marcador en directe d'un partit del Club Vòlei Santpedor">
<meta name="theme-color" content="#101214">
<style>
  /* A dark scoreboard (one look, like the app's): two team panels, court rotations, crowd bar. */
  :root { --bg:#101214; --card:#1b1f22; --home:#1e8c34; --away:#1f4fa8; --mint:#b9f6c0; --red:#e53935; --muted:#b0bec5; color-scheme: dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#fff; font-family:system-ui,-apple-system,Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  main { max-width:720px; margin:0 auto; padding:max(12px, env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-right,0px)) 120px max(14px, env(safe-area-inset-left,0px)); }
  header { display:flex; align-items:center; gap:12px; }
  header img { width:48px; height:48px; border-radius:50%; background:#fff; flex:none; }
  header .t { flex:1; min-width:0; }
  header h1 { font-size:17px; margin:0; }
  #status { color:var(--muted); font-size:13px; margin-top:2px; }
  .viewers { background:var(--card); border-radius:999px; padding:4px 10px; font-size:14px; white-space:nowrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#777; margin-right:6px; }
  .dot.live { background:var(--red); animation:p 1.4s infinite; }
  @keyframes p { 50% { opacity:.35; } }
  .btnrow { display:flex; gap:8px; margin:12px 0 4px; }
  .btn { flex:1; text-align:center; padding:11px; border-radius:12px; background:var(--mint); color:#000; font-weight:700; text-decoration:none; font-size:15px; border:0; cursor:pointer; }
  .btn.ghost { background:var(--card); color:#fff; }
  #comp { color:var(--muted); font-size:13px; text-align:center; margin:8px 0 0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:8px 0; }
  .chip { background:#263238; border-radius:6px; padding:3px 8px; font-size:13px; font-variant-numeric:tabular-nums; }
  .board { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .team { position:relative; border-radius:16px; padding:10px; text-align:center; min-height:220px; display:flex; flex-direction:column; align-items:center; border:3px solid transparent; transition:border-color .3s; }
  .team.home { background:var(--home); } .team.away { background:var(--away); }
  .team.serving { animation:glow 1.6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { border-color:rgba(185,246,192,.35); } 50% { border-color:rgba(185,246,192,1); } }
  .team .name { font-weight:700; font-size:15px; min-height:2.4em; }
  .setdots { display:flex; gap:5px; margin:4px 0; }
  .setdots i { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.25); display:block; }
  .setdots i.on { background:var(--mint); }
  .pts { font-size:min(24vw,140px); font-weight:900; line-height:1; flex:1; display:flex; align-items:center; justify-content:center; perspective:600px; font-variant-numeric:tabular-nums; }
  .pts span { display:inline-block; }
  .pts span.flip { animation:flip .32s ease-out; }
  @keyframes flip { from { transform:rotateX(-90deg); opacity:.2; } to { transform:rotateX(0); opacity:1; } }
  .flash { animation:flash .45s ease-out; }
  @keyframes flash { from { box-shadow: inset 0 0 0 999px rgba(255,255,255,.35); } to { box-shadow: inset 0 0 0 999px rgba(255,255,255,0); } }
  .label { position:absolute; top:44px; left:50%; transform:translateX(-50%); background:var(--mint); color:#000; font-weight:800; font-size:12px; border-radius:6px; padding:2px 7px; white-space:nowrap; }
  .streak { display:inline-block; background:rgba(0,0,0,.35); border-radius:8px; padding:1px 8px; font-weight:800; font-size:13px; animation:beat .7s ease-in-out infinite; }
  @keyframes beat { 50% { transform:scale(1.15); } }
  .serve { font-weight:700; font-size:13px; min-height:1.2em; }
  .court { margin-top:6px; background:rgba(0,0,0,.25); border-radius:8px; padding:4px 6px; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .court .row { display:grid; grid-template-columns:repeat(3, 34px); justify-items:center; }
  .court .row span small { display:block; font-size:9px; opacity:.55; font-weight:400; }
  .court .net { font-size:8px; opacity:.4; text-align:center; letter-spacing:4px; }
  .court .srv { color:var(--mint); }
  .court .info { color:var(--mint); font-size:11px; text-align:center; }
  .counts { font-size:12px; opacity:.85; margin-top:4px; }
  .final { background:var(--card); border-radius:12px; padding:12px; text-align:center; margin-top:10px; font-weight:700; }
  .note { color:var(--muted); font-size:13px; text-align:center; margin-top:14px; }
  .card { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:20; }
  .card div { background:rgba(16,18,20,.92); border:2px solid var(--mint); border-radius:20px; padding:18px 26px; text-align:center; animation:pop 3.2s ease forwards; }
  .card b { display:block; font-size:28px; color:var(--mint); }
  @keyframes pop { 0% { transform:scale(.4); opacity:0; } 12% { transform:scale(1.05); opacity:1; } 20% { transform:scale(1); } 85% { opacity:1; } 100% { opacity:0; } }
  .crowd { position:fixed; left:0; right:0; bottom:0; background:rgba(16,18,20,.96); border-top:1px solid #263238; z-index:10;
    padding:8px max(12px, env(safe-area-inset-right,0px)) max(8px, env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px)); }
  .crowd .in { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; }
  .crowd button { background:var(--card); color:#fff; border:0; border-radius:999px; font-size:22px; padding:6px 10px; cursor:pointer; touch-action:manipulation; }
  .crowd button.big { background:var(--mint); color:#000; font-size:15px; font-weight:800; padding:9px 14px; }
  .crowd button:active { transform:scale(.92); }
  .floaters { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:15; }
  .floaters span { position:absolute; bottom:90px; font-size:28px; animation:rise 2.8s ease-out forwards; }
  @keyframes rise { from { transform:translateY(0); opacity:1; } to { transform:translateY(-60vh); opacity:0; } }
  :focus-visible { outline:3px solid var(--mint); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .team.serving, .streak, .pts span.flip, .flash, .floaters span, .card div { animation:none !important; } .team.serving { border-color:var(--mint); } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo.jpg" alt="">
    <div class="t">
      <h1><span class="dot" id="dot"></span><span id="state">En directe</span></h1>
      <div id="status">Connectant…</div>
    </div>
    <span class="viewers" id="viewers" hidden title="Persones que el segueixen ara">👀 <b id="vn">1</b></span>
  </header>

  <div class="btnrow">
    <a class="btn" id="open" href="#">📲 Obrir a l'app</a>
    <button class="btn ghost" id="share" type="button">🔗 Comparteix</button>
  </div>

  <section id="score" hidden>
    <div id="comp"></div>
    <div class="chips" id="chips"></div>
    <div class="board">
      <div class="team home" id="th"><div class="name" id="hn"></div><div class="setdots" id="hd"></div><span class="streak" id="sth" hidden></span>
        <span class="label" id="lh" hidden></span><div class="pts"><span id="hp">0</span></div><div class="serve" id="svh"></div><div id="ch"></div><div class="counts" id="kh"></div></div>
      <div class="team away" id="ta"><div class="name" id="an"></div><div class="setdots" id="ad"></div><span class="streak" id="sta" hidden></span>
        <span class="label" id="la" hidden></span><div class="pts"><span id="ap">0</span></div><div class="serve" id="sva"></div><div id="ca"></div><div class="counts" id="ka"></div></div>
    </div>
    <div class="final" id="final" hidden></div>
  </section>

  <p class="note" id="wait">Esperant el marcador… Si no arriba res, potser la retransmissió encara no ha començat o ja fa més de 12 hores que va acabar.</p>
  <p class="note">Anima des d'aquí: els aplaudiments, el tambor i les reaccions arriben a qui porta el marcador i a tothom que el segueix.</p>
</main>

<div class="crowd" id="crowd" hidden>
  <div class="in">
    <button class="big" id="clap" type="button" aria-label="Aplaudeix">👏 <span id="claps">0</span></button>
    <button class="big" id="drum" type="button" aria-label="Toca el tambor">🥁 <span id="drums">0</span></button>
    <button type="button" data-r="🔥" aria-label="Foc">🔥</button>
    <button type="button" data-r="😱" aria-label="Sorpresa">😱</button>
    <button type="button" data-r="💪" aria-label="Força">💪</button>
    <button type="button" data-r="😍" aria-label="M'encanta">😍</button>
    <button type="button" data-r="🏐" aria-label="Pilota">🏐</button>
  </div>
</div>
<div class="floaters" id="floaters" aria-hidden="true"></div>
<div class="card" id="card" hidden aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var RELAY = "https://ntfy.sh/";
  var PKG = "cat.voleisantpedor.app";
  var m = /vsp-[a-z0-9]{6,32}/.exec((location.hash + " " + location.search + " " + location.pathname).toLowerCase());
  var topic = m && m[0];
  var $ = function (id) { return document.getElementById(id); };

  }
  // Android: open the app by its own scheme; without the app, stay on this page.
  $("open").href = "intent://live/" + topic + "#Intent;scheme=voleisantpedor;package=" + PKG +
    ";S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end";
  if (!/Android/i.test(navigator.userAgent)) $("open").hidden = true;
  $("share").onclick = function () {
    var url = location.origin + location.pathname + "#" + topic;
    if (navigator.share) navigator.share({ title: document.title, url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { $("share").textContent = "✅ Enllaç copiat"; }, function () {});
  };

  /* ---------- the app's ScoreEngine (events: h/a point, T/t time-out, C/c substitution, V/v serve,

  function rotate(l) { return l && l.length > 1 ? l.slice(1).concat([l[0]]) : l; }
  function decode(d) {
    var e = d.e || "", ev = [];
    for (var i = 0; i < e.length; i++) {
      var c = e[i];
      if (c === "[") { var j = e.indexOf("]", i); if (j < 0) break; var body = e.substring(i + 1, j);
        if (body) ev.push({ k: "L", s: body[0] === "A" ? "A" : "H", p: body.substring(1).split(",").filter(Boolean) }); i = j; continue; }
      if (c === "h" || c === "a") ev.push({ k: "P", s: c === "h" ? "H" : "A" });
      else if (c === "T" || c === "t") ev.push({ k: "T", s: c === "T" ? "H" : "A" });
      else if (c === "C" || c === "c") ev.push({ k: "C", s: c === "C" ? "H" : "A" });
      else if (c === "V" || c === "v") ev.push({ k: "V", s: c === "V" ? "H" : "A" });
      else if (c === "W") ev.push({ k: "W" });
    }

      var at = {};
      String(d.x).split(";").forEach(function (p) { var f = p.split(":"); if (f.length >= 4 && f[2] && f[3]) (at[+f[0]] = at[+f[0]] || []).push({ k: "S", s: f[1] === "A" ? "A" : "H", o: f[2], n: f[3] }); });
      var out = [];
      ev.forEach(function (x, i) { (at[i] || []).forEach(function (s) { out.push(s); }); out.push(x); });
      (at[ev.length] || []).forEach(function (s) { out.push(s); });
      ev = out;
    }
    return ev;
  }
  function replay(d) {
    var r = String(d.r).split(",").map(Number);
    var R = { win: r[0], pts: r[1], tb: r[2], lead: r[3], to: r[4], subs: r[5], all: r[6] === 1 };
    R.max = R.win * 2 - 1;
    var S = { sets: [], h: 0, a: 0, sh: 0, sa: 0, n: 1, server: d.f === "A" ? "A" : "H", toH: 0, toA: 0, suH: 0, suA: 0,
      lineH: null, lineA: null, rotH: null, rotA: null, done: false, runSide: null, run: 0 };
    var setFirst = S.server;
    function target() { return (R.max > 1 && S.n === R.max) ? R.tb : R.pts; }
    decode(d).forEach(function (x) {
      if (S.done) return;
      if (x.k === "P") {
        if (x.s !== S.server) { S.server = x.s; if (x.s === "H") S.rotH = rotate(S.rotH); else S.rotA = rotate(S.rotA); }
        if (x.s === "H") S.h++; else S.a++;
        if (S.runSide === x.s) S.run++; else { S.runSide = x.s; S.run = 1; }
        if (Math.max(S.h, S.a) >= target() && Math.abs(S.h - S.a) >= R.lead) {
          S.sets.push([S.h, S.a]); if (S.h > S.a) S.sh++; else S.sa++;
          S.done = R.all ? S.sets.length >= R.max : (S.sh === R.win || S.sa === R.win);
          if (!S.done) { S.n++; S.h = 0; S.a = 0; S.toH = S.toA = S.suH = S.suA = 0; setFirst = setFirst === "H" ? "A" : "H"; S.server = setFirst; S.rotH = S.lineH; S.rotA = S.lineA; }
        }
      } else if (x.k === "T") { if (x.s === "H") S.toH = Math.min(S.toH + 1, R.to); else S.toA = Math.min(S.toA + 1, R.to); }
      else if (x.k === "C") { if (x.s === "H") S.suH = Math.min(S.suH + 1, R.subs); else S.suA = Math.min(S.suA + 1, R.subs); }
      else if (x.k === "V") { S.server = x.s; if (S.h === 0 && S.a === 0) setFirst = x.s; }
      else if (x.k === "L") { var p = x.p.slice(0, 6); if (x.s === "H") { S.lineH = p; S.rotH = p; } else { S.lineA = p; S.rotA = p; } }
      else if (x.k === "S") { var sw = function (l) { return l && l.map(function (v) { return v === x.o ? x.n : v; }); };
        if (x.s === "H") { S.rotH = sw(S.rotH); S.lineH = sw(S.lineH); } else { S.rotA = sw(S.rotA); S.lineA = sw(S.lineA); } }
    });
    if (S.done) { var last = S.sets[S.sets.length - 1]; S.h = last[0]; S.a = last[1]; }
    S.R = R;
    S.setPoint = function (side) {
      if (S.done) return false;
      var mine = (side === "H" ? S.h : S.a) + 1, theirs = side === "H" ? S.a : S.h;
      return mine >= target() && mine - theirs >= R.lead;
    };
    S.matchPoint = function (side) {
      if (!S.setPoint(side)) return false;
      var my = side === "H" ? S.sh : S.sa, their = side === "H" ? S.sa : S.sh;
      return R.all ? (S.sets.length + 1 === R.max && my + 1 > their) : my + 1 === R.win;
    };
    return S;
  }
  function rotNumber(line, cur) {
    if (!line || !cur || line.length !== 6 || cur.length !== 6) return null;
    for (var k = 0; k < 6; k++) { if (line.slice(k).concat(line.slice(0, k)).join("|") === cur.join("|")) return k + 1; }
    return null;
  }
  var POS = ["I", "II", "III", "IV", "V", "VI"];
  function court(rot, line, serving) {
    if (!rot || rot.length !== 6) return "";
    function cell(i) { return '<span class="' + (i === 0 ? "srv" : "") + '">' + esc(rot[i]) + "<small>" + POS[i] + "</small></span>"; }
    var k = rotNumber(line, rot);
    return '<div class="court"><div class="row">' + cell(3) + cell(2) + cell(1) + '</div><div class="net">— — —</div><div class="row">' + cell(4) + cell(5) + cell(0) +
      '</div><div class="info">' + (serving ? "🏐 " + esc(rot[0]) : "↻ " + esc(rot[1])) + (k ? " · R" + k : "") + "</div></div>";
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---------- show a snapshot */
  var lastT = 0, lastSent = 0, prev = null;
  function setNum(id, v, animate) {
    var el = $(id);
    if (el.textContent === String(v)) return;
    el.textContent = v;
    if (animate && !reduce) { el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); }
  }
  function dots(id, won, toWin) { var h = ""; for (var i = 0; i < toWin; i++) h += '<i class="' + (i < won ? "on" : "") + '"></i>'; $(id).innerHTML = h; }
  function showCard(title, line) {
    var c = $("card"); c.innerHTML = "<div><b>" + esc(title) + "</b>" + esc(line) + "</div>"; c.hidden = false;
    clearTimeout(showCard.t); showCard.t = setTimeout(function () { c.hidden = true; }, 3300);
  }
  function show(d) {
    if (d.v !== 1 || (d.t || 0) < lastT) return;
    lastT = d.t || 0; lastSent = Date.now();
    var s = replay(d), live = !s.done && d.end === 0;
    $("wait").hidden = true; $("score").hidden = false; $("crowd").hidden = !live;
    $("hn").textContent = d.h; $("an").textContent = d.a; $("comp").textContent = d.c || "";
    var animate = prev !== null;
    setNum("hp", s.h, animate); setNum("ap", s.a, animate);
    if (animate) {   // flash the panel that won the point
      if (s.h > prev.h || s.sh > prev.sh) { $("th").classList.remove("flash"); void $("th").offsetWidth; $("th").classList.add("flash"); }
      if (s.a > prev.a || s.sa > prev.sa) { $("ta").classList.remove("flash"); void $("ta").offsetWidth; $("ta").classList.add("flash"); }
      if (s.sets.length > prev.sets.length) {   // a set (or the match) has just ended
        var last = s.sets[s.sets.length - 1], winner = last[0] > last[1] ? d.h : d.a;
        showCard(s.done ? "🏆 " + winner : "SET " + s.sets.length, s.done ? "guanya " + s.sh + "-" + s.sa : winner + " · " + last[0] + "-" + last[1]);
      }
    }
    dots("hd", s.sh, s.R.all ? s.R.max : s.R.win); dots("ad", s.sa, s.R.all ? s.R.max : s.R.win);
    ["H", "A"].forEach(function (side) {
      var k = side === "H" ? "h" : "a", serving = live && s.server === side;
      $("t" + k).classList.toggle("serving", serving);
      $("sv" + k).textContent = serving ? "🏐 Serveix" : "";
      var lab = $("l" + k), txt = s.matchPoint(side) ? "PUNT DE PARTIT" : s.setPoint(side) ? "PUNT DE SET" : "";
      lab.textContent = txt; lab.hidden = !txt || !live;
      var st = $("st" + k), streak = live && s.runSide === side && s.run >= 3 ? s.run : 0;
      st.textContent = "🔥 Ratxa: " + streak; st.hidden = !streak;
      $("c" + k).innerHTML = court(side === "H" ? s.rotH : s.rotA, side === "H" ? s.lineH : s.lineA, side === s.server && live);
      $("k" + k).textContent = "Temps morts " + (side === "H" ? s.toH : s.toA) + "/" + s.R.to + " · Canvis " + (side === "H" ? s.suH : s.suA) + "/" + s.R.subs;
    });
    var chips = $("chips"); chips.innerHTML = "";
    s.sets.forEach(function (x, i) { var el = document.createElement("span"); el.className = "chip"; el.textContent = "S" + (i + 1) + "  " + x[0] + "-" + x[1]; chips.appendChild(el); });
    var fin = $("final");
    if (s.done) { fin.hidden = false; fin.textContent = "🏆 Guanya " + (s.sh > s.sa ? d.h : d.a) + " (" + s.sh + "-" + s.sa + ")"; }
    else if (d.end === 2) { fin.hidden = false; fin.textContent = "La retransmissió s’ha aturat"; }
    else fin.hidden = true;
    $("dot").className = "dot" + (live ? " live" : "");
    $("state").textContent = s.done || d.end === 1 ? "Partit finalitzat" : d.end === 2 ? "Retransmissió aturada" : "En directe · Set " + s.n;
    document.title = d.h + " " + s.sh + "-" + s.sa + " " + d.a + " · Vòlei Santpedor";
    $("status").textContent = "Actualitzat fa un moment";
    prev = { h: s.h, a: s.a, sh: s.sh, sa: s.sa, sets: s.sets.slice() };
  }

  var es = new EventSource(RELAY + topic + "/sse?since=latest");
  es.onopen = function () { if (!lastSent) $("status").textContent = "Connectat"; };
  es.onmessage = function (ev) { try { show(JSON.parse(JSON.parse(ev.data).message)); } catch (e) {} };
  es.onerror = function () { $("status").textContent = "Sense connexió amb el directe. Reintentant…"; };
  setInterval(function () {
    if (!lastSent) return;
    var s = Math.round((Date.now() - lastSent) / 1000);
    if (s >= 60) $("status").textContent = "Actualitzat fa " + Math.floor(s / 60) + " min";
  }, 10000);

  /* ---------- crowd, same channels and formats as the app (extras/Viewers, Claps, Reactions) */
  function rid(n) { var a = "abcdefghijkmnpqrstuvwxyz23456789", s = ""; for (var i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
  var me = rid(16);
  function post(t, body) { return fetch(RELAY + t, { method: "POST", body: body }).catch(function () {}); }
  // 👀 viewers: everybody pings "-p" every minute; seen in the last 150 s = following now
  var seen = {};
  function countViewers() { var now = Date.now() / 1000, n = 0; for (var k in seen) if (now - seen[k] <= 150) n++; $("vn").textContent = Math.max(n, 1); $("viewers").hidden = false; }
  var pv = new EventSource(RELAY + topic + "-p/sse?since=3m");
  pv.onmessage = function (ev) { try { var o = JSON.parse(ev.data), m = JSON.parse(o.message); if (m.v === 1 && m.id) { seen[m.id] = Math.max(seen[m.id] || 0, o.time); countViewers(); } } catch (e) {} };
  function ping() { post(topic + "-p", JSON.stringify({ v: 1, id: me })); }
  ping(); setInterval(ping, 60000); setInterval(countViewers, 15000);
  // 👏 claps and 🥁 drum: taps sent together every 1.5 s (at most 50 per message)
  function sender(t, kind, counterId) {
    var pending = 0, timer = null, opened = Date.now() / 1000, total = 0;
    var src = new EventSource(RELAY + t + "/sse?since=latest");
    src.onmessage = function (ev) { try { var o = JSON.parse(ev.data), m = JSON.parse(o.message); if (m.v === 1 && m.n > 0 && m.n <= 50 && (m.k || "clap") === kind && o.time >= opened - 10) { total += m.n; $(counterId).textContent = total; } } catch (e) {} };
    return function () {
      pending = Math.min(pending + 1, 50);
      if (!timer) timer = setTimeout(function () {
        var n = pending; pending = 0; timer = null;
        if (n > 0) post(t, kind === "clap" ? JSON.stringify({ v: 1, n: n }) : JSON.stringify({ v: 1, n: n, k: kind }));
      }, 1500);
    };
  }
  $("clap").onclick = sender(topic + "-a", "clap", "claps");
  $("drum").onclick = sender(topic + "-b", "drum", "drums");
  // 🔥 reactions: shown floating for everybody (our own at once), sent in batches every 3 s
  var EMOJIS = ["🔥", "😱", "💪", "😍", "🏐"], batch = {}, rtimer = null, floating = 0;
  function float(e) {
    if (floating >= 30 || reduce) return;
    floating++;
    var s = document.createElement("span"); s.textContent = e;
    s.style.left = (10 + Math.random() * 80) + "%"; s.style.fontSize = (22 + Math.random() * 14) + "px"; s.style.animationDuration = (2.2 + Math.random() * 1.4) + "s";
    $("floaters").appendChild(s);
    s.addEventListener("animationend", function () { s.remove(); floating--; });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".crowd [data-r]"), function (b) {
    b.onclick = function () {
      var e = b.dataset.r; float(e);
      var total = 0; for (var k in batch) total += batch[k];
      if (total < 20) batch[e] = (batch[e] || 0) + 1;
      if (!rtimer) rtimer = setTimeout(function () {
        var r = {}, any = false; EMOJIS.forEach(function (x) { if (batch[x]) { r[x] = batch[x]; any = true; } });
        batch = {}; rtimer = null;
        if (any) post(topic + "-r", JSON.stringify({ v: 1, r: r, s: me }));
      }, 3000);
    };
  });
  var rs = new EventSource(RELAY + topic + "-r/sse?since=latest");
  rs.onmessage = function (ev) {
    try { var m = JSON.parse(JSON.parse(ev.data).message); if (m.v !== 1 || !m.r || m.s === me) return;
      var n = 0; EMOJIS.forEach(function (e) { var k = Math.min(+m.r[e] || 0, 20 - n); for (var i = 0; i < k; i++, n++) setTimeout(function () { float(e); }, i * 120); }); } catch (e) {}
  };
})();
</script>
</body>
</html>
